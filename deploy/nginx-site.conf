# Host nginx site for the portfolio. Everything goes to the frontend container,
# which itself proxies /api to Flask and serves /static/uploads.
#
#   sudo cp deploy/nginx-site.conf /etc/nginx/sites-available/itsclara.dev
#   sudo ln -s /etc/nginx/sites-available/itsclara.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d itsclara.dev -d www.itsclara.dev   # adds the 443 block

# sites-enabled is included inside the http block, so the zone can live here.
limit_req_zone $binary_remote_addr zone=portfolio_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name itsclara.dev www.itsclara.dev;

    server_tokens off;
    # The public site only reads; nothing legitimate uploads through it.
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Uncomment once HTTPS works for both names; browsers cache it for a year.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Login and admin API are not public. Reach them over SSH instead:
    #   ssh -L 5001:127.0.0.1:5001 user@server   then use http://localhost:5001
    location ~ ^/api/v1/(auth|admin)(/|$) {
        return 404;
    }

    location /api/ {
        limit_req zone=portfolio_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }
}
